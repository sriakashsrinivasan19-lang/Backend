<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
//Given [10, 20, 30, 40], check whether any number is greater than 35 using some().

        const arr= [10, 20, 30, 40];
        let result= arr.some((check)=> check > 5);
        console.log(result);
             
// Check whether all students scored above 50 using every().
        const students = [{ name: "Sriakash" , marks: 70},
                          {name: "Suvalakshmi", marks: 55},
                          {name: "praveen", marks: 80},
                          {name: "sri", marks:90}];
        let scores= students.every((check)=> check.marks > 50);
        console.log(scores);
         
// Check whether "admin" exists in a roles array using includes().
        let roles = ["active","admin","inactive","admins"];
        console.log(roles.includes("admin"));
        
// Calculate the total salary of five employees using reduce().
        const employees = [{ name: "Sriakash" , salary:50000},
                          {name: "Suvalakshmi", salary:45000},
                          {name: "praveen", salary:40000},
                          {name: "sri", salary:35000},
                          {name:"arun", salary:30000}];
        let totalSalary = employees.reduce((sum,item)=>{
            return sum + item.salary
        },0)
        console.log(totalSalary);
        
// Calculate a shopping cart's total using price * quantity.
        const carts = [{ name: "phone", price: 50000, qty: 2 },
                       { name: "earpods", price: 500, qty: 2 },
                       { name: "speaker", price: 1500, qty: 1 }];
        const total = carts.reduce((sum, item) => {
            return sum + item.price * item.qty;
        }, 0);
        console.log(total);

// Find employees earning more than ₹30,000 using filter().
        const employee = [{ name: "Sriakash" , salary:50000},
                          {name: "Suvalakshmi", salary:45000},
                          {name: "praveen", salary:40000},
                          {name: "sri", salary:25000},
                          {name:"arun", salary:30000}];
        const earns = employee.filter((check)=> check.salary > 30000);
        console.log(earns);
        
// Find a student by ID using find().
        const studentsInfo = [{id:1, name: "Sriakash" },
                              {id:2, name: "Suvalakshmi"},
                              {id:3, name: "praveen"},
                              {id:4, name: "sri"}];
        const letsFind = studentsInfo.find((student)=> student.id===1);
        console.log(letsFind);
        
// Get the index of a product by ID using findIndex().
        const product = [{ name: "phone", price: 50000, id: 1 },
                       { name: "earpods", price: 500, id: 2 },
                       { name: "speaker", price: 1500, id: 3 }];
        const index = product.findIndex((student)=> student.id===2);
        console.log(index); 
        
// Sort products by price from low to high.
        const products = [5000,2000,1000,300]
        const ascending = [...products].sort((a,b)=>a-b)
        console.log(ascending);
        
// Extract only employee names using map().
        const employeeInfo = [{id:1, name: "Sriakash" },
                              {id:2, name: "Suvalakshmi"},
                              {id:3, name: "praveen"},
                              {id:4, name: "sri"}];
        const names = employeeInfo.map((employee)=>employee.name);
        console.log("Employee Name",names);
        
    </script>
</body>
</html>
